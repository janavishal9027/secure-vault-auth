spring:
  application:
    name: Authentication

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
        starttls:
          enable: true

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            # Locally this resolves to http://localhost:3211/authentication/...
            # In the cluster, set OAUTH2_REDIRECT_BASE_URL to the public https
            # origin (incl. /authentication context path) so Google/GitHub get
            # an https callback regardless of forwarded-header propagation.
            redirect-uri: "${OAUTH2_REDIRECT_BASE_URL:{baseUrl}}/login/oauth2/code/{registrationId}"
            scope:
              - read:user
              - user:mail
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

server:
  port: 3211
  # Honor X-Forwarded-* from the ingress (Traefik) so OAuth2 redirect URIs are
  # built with the public https host, not the internal http pod address.
  forward-headers-strategy: framework
  servlet:
    context-path: /authentication


security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: ${JWT_EXPIRATION}

internal:
  role-service-key: ${ROLE_SERVICE_KEY}

delegate:
  bootstrap:
    key: ${DELEGATE_BOOTSTRAP_KEY}
    # Defaults to true: the bootstrap endpoint exists to create the very first
    # delegate. Left open, anyone holding the bootstrap key can mint unlimited
    # delegate accounts.
    allow-first-only: ${DELEGATE_ALLOW_FIRST_ONLY:true}

springdoc:
  swagger-ui:
    path: /swagger.html


digital:
  app:
    roles: ${ROLES_SERVICE_URL}


frontend:
  url: ${FRONTEND_URL}